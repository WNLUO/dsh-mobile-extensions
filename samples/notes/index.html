<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>记事本</title>
<style>
  :root {
    --bg: var(--dsh-theme-background, #ffffff);
    --surface: var(--dsh-theme-surface, #f7f7f8);
    --border: var(--dsh-theme-border, #e5e5e7);
    --text: var(--dsh-theme-text, #1c1c1e);
    --muted: var(--dsh-theme-text-muted, #8a8a8e);
    --primary: var(--dsh-theme-primary, #2f80ff);
    --danger: var(--dsh-theme-danger, #ef4444);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    padding: 12px 16px max(16px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .hint { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  .compose { display: flex; gap: 8px; margin-bottom: 12px; }
  textarea {
    flex: 1; min-height: 72px; resize: vertical; font: inherit; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px;
  }
  button {
    font: inherit; color: var(--primary); background: none;
    border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px;
  }
  button:active { opacity: 0.6; }
  button:disabled { opacity: 0.4; }
  button.primary { color: #fff; background: var(--primary); border-color: var(--primary); }
  button.danger { color: var(--danger); }
  ul { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
  li { display: flex; gap: 8px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border); }
  li .body { white-space: pre-wrap; word-break: break-word; flex: 1; min-width: 0; }
  li .del { flex: none; padding: 4px 10px; }
  .empty { color: var(--muted); text-align: center; padding: 32px 0; font-size: 13px; }
  .foot { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  #err { color: var(--danger); font-size: 12px; margin: 8px 0 0; white-space: pre-wrap; min-height: 1em; }
</style>
</head>
<body>
  <h1>记事本</h1>
  <p class="hint">数据存在 App 托管的仓库里：关掉页面再进来、换一版扩展都还在，卸载才清。</p>
  <div class="compose">
    <textarea id="input" placeholder="写点什么…"></textarea>
    <button id="add" class="primary">添加</button>
  </div>
  <ul id="list"></ul>
  <p class="foot" id="foot"></p>
  <p id="err"></p>

<script>
/*
 * 演示 storage：App 按扩展名落盘的那份数据。
 * 不要用页面自己的 localStorage —— 换版本、目录一挪就可能找不着，还跟别的扩展挤同一个来源。
 * 收发都是字符串，对象自己 JSON 化（文档 5.7）。
 */
(function () {
  var KEY = 'notes.items';
  var ext = window.__dshExtension || {};
  var storage = ext.storage;
  var listEl = document.getElementById('list');
  var footEl = document.getElementById('foot');
  var errEl = document.getElementById('err');
  var inputEl = document.getElementById('input');
  var addBtn = document.getElementById('add');

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function fail(error) {
    errEl.textContent = '存不了：' + (error && error.code ? error.code : error);
  }

  if (!storage) {
    addBtn.disabled = true;
    errEl.textContent = '这个扩展没有 storage 能力，留不住内容。';
    listEl.innerHTML = '<li class="empty">没有可用的存储</li>';
    return;
  }

  function load() {
    return storage.get(KEY).then(function (raw) { return raw ? JSON.parse(raw) : []; });
  }
  function save(items) { return storage.set(KEY, JSON.stringify(items)); }

  function render(items) {
    footEl.textContent = '共 ' + items.length + ' 条';
    if (!items.length) {
      listEl.innerHTML = '<li class="empty">还没有内容，写一条试试。</li>';
      return;
    }
    listEl.innerHTML = items.map(function (item, i) {
      return '<li><span class="body">' + escapeHtml(item.text) + '</span>'
        + '<button class="del danger" data-i="' + i + '">删除</button></li>';
    }).join('');
    Array.prototype.forEach.call(listEl.querySelectorAll('.del'), function (btn) {
      btn.addEventListener('click', function () {
        var i = Number(btn.getAttribute('data-i'));
        load().then(function (items) { items.splice(i, 1); return save(items); })
          .then(load).then(render).catch(fail);
      });
    });
  }

  addBtn.addEventListener('click', function () {
    var text = inputEl.value.trim();
    if (!text) return;
    errEl.textContent = '';
    load().then(function (items) {
      items.unshift({ text: text, at: Date.now() });
      return save(items);
    }).then(function () {
      inputEl.value = '';
      return load();
    }).then(render).catch(fail);
  });

  load().then(render).catch(fail);
})();
</script>
</body>
</html>
